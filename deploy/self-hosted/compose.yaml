name: ${COMPOSE_PROJECT_NAME:-aion2-economy}

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../infra/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../..
      dockerfile: deploy/self-hosted/Dockerfile.api
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_HMAC_KEY_B64: ${SESSION_HMAC_KEY_B64:?set SESSION_HMAC_KEY_B64 in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      WRITE_FENCED: ${WRITE_FENCED:-false}
      SNAPSHOT_ROOT: /var/lib/aion2/snapshots
      ITEM_ASSET_ROOT: /var/lib/aion2/item-icons
    ports:
      - 127.0.0.1:${SITE_PORT:-8080}:8080
    volumes:
      - ./runtime/snapshots:/var/lib/aion2/snapshots:ro
      - ./runtime/public/assets:/var/lib/aion2/item-icons:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

  market-worker:
    build:
      context: ../..
      dockerfile: deploy/self-hosted/Dockerfile.worker
    environment:
      AION2_APP_ROOT: /opt/aion2
      AION2_INBOX: /var/lib/aion2/inbox
      AION2_STATE: /var/lib/aion2/state
      AION2_SNAPSHOTS: /var/lib/aion2/snapshots
      AION2_SCAN_INTERVAL_SECONDS: ${AION2_SCAN_INTERVAL_SECONDS:-3600}
      AION2_SESSION_MAX_AGE_SECONDS: ${AION2_SESSION_MAX_AGE_SECONDS:-900}
      AION2_CLIENT_BUILD: ${AION2_CLIENT_BUILD:-25650019}
    volumes:
      - ./runtime/inbox:/var/lib/aion2/inbox
      - ./runtime/state:/var/lib/aion2/state
      - ./runtime/snapshots:/var/lib/aion2/snapshots
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert pathlib.Path('/var/lib/aion2/state/market-history.sqlite').is_file()"]
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
